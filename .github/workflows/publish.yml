name: Publish Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.1 pnpm@11.1.2
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: pnpm check
      - run: npm pack --dry-run
      - name: Check whether version already exists
        id: registry
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.registry.outputs.exists != 'true'
        run: npm publish --access public
      - name: Report bootstrap version
        if: steps.registry.outputs.exists == 'true'
        run: echo "$(node -p "require('./package.json').name + '@' + require('./package.json').version") already exists; skipping publish."
